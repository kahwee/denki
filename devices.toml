# devices.toml — TP-Link device feature map
#
# Machine-readable source of truth for device capabilities and API endpoints.
# Used to drive: documentation generation, capability guards in CLI, test fixtures.
#
# Verified by live packet probing on real hardware (2026-05-08).
# Error code -2001 = "module not support", -1 = "not support"

# ─────────────────────────────────────────────────────────────────────────────
# Protocol
# ─────────────────────────────────────────────────────────────────────────────

[protocol.legacy]
name        = "Kasa XOR"
port        = 9999
transport   = ["tcp", "udp"]
cipher      = "xor-autokey"
key_start   = 171
tcp_framing = "4-byte-be-length-prefix"
udp_framing = "none"  # no length prefix in UDP — raw cipher bytes only
notes       = "All devices below use this protocol"

[protocol.klap]
name        = "KLAP / Tapo"
port        = 80
transport   = ["tcp"]
cipher      = "aes-cbc"
auth        = "sha256-handshake"
notes       = "Newer Tapo devices (P125, L530). Not implemented in denki."

# ─────────────────────────────────────────────────────────────────────────────
# Devices
# ─────────────────────────────────────────────────────────────────────────────

[[devices]]
model       = "KL135"
name        = "Smart Wi-Fi LED Bulb with Color Changing"
mic_type    = "IOT.SMARTBULB"
protocol    = "legacy"
hw_versions = ["1.0", "2.6"]

  [devices.hw_diff]
  # Fields present in HW 2.6 sysinfo but absent in HW 1.0
  hw_2_6_only = ["fade_on_off", "lnk_on", "re_power"]
  # API commands available only on HW 2.6
  hw_2_6_commands = ["smartlife.iot.smartbulb.lightingservice/get_default_behavior"]

  [[devices.features]]
  id          = "power"
  supported   = true
  command     = "smartlife.iot.smartbulb.lightingservice/transition_light_state"
  fields      = ["on_off"]
  notes       = "on_off: 1=on, 0=off. transition_period: 0 for instant."

  [[devices.features]]
  id          = "brightness"
  supported   = true
  command     = "smartlife.iot.smartbulb.lightingservice/transition_light_state"
  fields      = ["brightness"]
  range       = [0, 100]

  [[devices.features]]
  id          = "color_temp"
  supported   = true
  command     = "smartlife.iot.smartbulb.lightingservice/transition_light_state"
  fields      = ["color_temp", "hue", "saturation"]
  range       = [2500, 9000]
  notes       = "Set hue=0 and saturation=0 to fully activate CCT mode. Mutually exclusive with HSV color."

  [[devices.features]]
  id          = "color_hsv"
  supported   = true
  command     = "smartlife.iot.smartbulb.lightingservice/transition_light_state"
  fields      = ["hue", "saturation", "brightness", "color_temp"]
  ranges      = {hue = [0, 360], saturation = [0, 100], brightness = [0, 100]}
  notes       = "Set color_temp=0 to activate color mode. Mutually exclusive with CCT mode."

  [[devices.features]]
  id          = "energy_realtime"
  supported   = true
  command     = "smartlife.iot.common.emeter/get_realtime"
  returns     = ["power_mw", "total_wh"]
  missing     = ["voltage_mv", "current_ma"]
  notes       = "Uses smartlife namespace. Bare 'emeter' returns -2001 on this device."

  [[devices.features]]
  id          = "energy_daily"
  supported   = true
  command     = "smartlife.iot.common.emeter/get_daystat"
  params      = ["month", "year"]
  returns     = ["day_list[].energy_wh"]

  [[devices.features]]
  id          = "energy_monthly"
  supported   = true
  command     = "smartlife.iot.common.emeter/get_monthstat"
  params      = ["year"]
  returns     = ["month_list[].energy_wh"]

  [[devices.features]]
  id          = "specs"
  supported   = true
  command     = "smartlife.iot.smartbulb.lightingservice/get_light_details"
  returns     = ["lamp_beam_angle", "wattage", "incandescent_equivalent", "max_lumens", "color_rendering_index", "min_voltage", "max_voltage"]
  known_values = {lamp_beam_angle = 220, wattage = 10, incandescent_equivalent = 60, max_lumens = 800, color_rendering_index = 90, min_voltage = 100, max_voltage = 120}

  [[devices.features]]
  id          = "presets"
  supported   = true
  command     = "smartlife.iot.smartbulb.lightingservice/get_preferred_state"
  returns     = ["states[].index", "states[].hue", "states[].saturation", "states[].color_temp", "states[].brightness"]
  notes       = "4 preset slots (index 0–3). Default: warm white 2700K 50%, red, green, blue."

  [[devices.features]]
  id          = "default_behavior"
  supported   = "hw_2_6_only"
  command     = "smartlife.iot.smartbulb.lightingservice/get_default_behavior"
  returns     = ["soft_on.mode", "hard_on.mode", "re_power_type"]

  [[devices.features]]
  id          = "schedule"
  supported   = false
  error_code  = -2001
  notes       = "Schedule module not present on KL135."

  [[devices.features]]
  id          = "countdown"
  supported   = false
  error_code  = -2001

  [[devices.features]]
  id          = "time"
  supported   = false
  error_code  = -2001
  notes       = "KL135 has no real-time clock module exposed via local API."

  [[devices.features]]
  id          = "effects"
  supported   = false
  error_code  = -2001
  notes       = "The Kasa app shows effects but they are not available via local API."

  [[devices.features]]
  id          = "led_indicator"
  supported   = false
  notes       = "KL135 has no controllable status LED."

  [[devices.features]]
  id          = "rename"
  supported   = true
  command     = "system/set_dev_alias"
  fields      = ["alias"]

  [[devices.features]]
  id          = "restart"
  supported   = true
  command     = "system/reboot"
  fields      = ["delay"]

