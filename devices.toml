  supported   = true
  command     = "smartlife.iot.dimmer/set_brightness"
  fields      = ["brightness"]
  range       = [1, 100]
  notes       = "Dimmers do not accept brightness=0; use set_relay_state to turn off. set_dimmer_transition supports fade."

  [[devices.features]]
  id          = "dimmer_transition"
  supported   = true
  command     = "smartlife.iot.dimmer/set_dimmer_transition"
  fields      = ["brightness", "duration"]
  notes       = "Fade to brightness over duration milliseconds. brightness=0 turns off."

  [[devices.features]]
