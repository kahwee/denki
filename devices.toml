# ─────────────────────────────────────────────────────────────────────────────
# Detection rules for legacy IOT devices (mic_type or type field)
# ─────────────────────────────────────────────────────────────────────────────
#
# Given sysinfo, device class is determined as follows (in order):
#   1. mic_type/type contains "SMARTBULB" and sysinfo has "length" → LightStrip
#   2. mic_type/type contains "SMARTBULB"                          → Bulb
#   3. mic_type/type contains "SMARTPLUG"/"SWITCH" and dev_name contains "Dimmer" → Dimmer
#   4. mic_type/type contains "SMARTPLUG"/"SWITCH" and sysinfo has "children"     → Strip
#   5. mic_type/type contains "SMARTPLUG"/"SWITCH" and dev_name contains "light"  → WallSwitch
#   6. mic_type/type contains "SMARTPLUG"/"SWITCH"                                → Plug
#
# Source: kasa.iot.iotdevice.IotDevice._get_device_type_from_sys_info

# ─────────────────────────────────────────────────────────────────────────────

