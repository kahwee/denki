  command     = "smartlife.iot.dimmer/get_default_behavior"
  returns     = ["double_click_action", "long_press_action"]
  notes       = "Configure button double-click and long-press actions (none/instant/gentle/preset)."

  [[devices.features]]
  id          = "motion_sensor"
  supported   = "hardware_dependent"
  command     = "smartlife.iot.PIR/get_config"
  notes       = "PIR motion sensor. Only present on hardware variants that include the sensor."

  [[devices.features]]
  id          = "ambient_light"
  supported   = "hardware_dependent"
  command     = "smartlife.iot.LAS/get_config"
  notes       = "Ambient light sensor. Only present on hardware variants that include the sensor."

  [[devices.features]]
  id          = "schedule"
  supported   = true
  command     = "schedule/get_rules"

  [[devices.features]]
  id          = "countdown"
  supported   = true
  command     = "count_down/get_rules"

  [[devices.features]]
  id          = "anti_theft"
  supported   = true
  command     = "anti_theft/get_rules"

  [[devices.features]]
  id          = "time"
  supported   = true
  command     = "time/get_time"

  [[devices.features]]
  id          = "rename"
  supported   = true
  command     = "system/set_dev_alias"

  [[devices.features]]
  id          = "restart"
  supported   = true
  command     = "system/reboot"

