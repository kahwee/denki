protocol    = "legacy"
notes       = "Wall dimmer switch. Brightness via smartlife.iot.dimmer, NOT lightingservice. May include PIR motion and ambient light sensors."

  [[devices.features]]
  id          = "power"
  supported   = true
  command     = "system/set_relay_state"
  fields      = ["state"]

  [[devices.features]]
