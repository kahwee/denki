[advisories]
# Reviewed 2026-10-06 for exactly tapo 0.11.1 -> rsa 0.10.0-rc.19.
# https://rustsec.org/advisories/RUSTSEC-2023-0071.html concerns observable
# private-key operations (PKCS#1 v1.5 decryption). In tapo 0.11.1, RSA is used
# only by src/api/discovery/aes_discovery_query_generator.rs: generate a key,
# export its public PEM, discard the private key. There is no RSA decryption
# or signing call in tapo's source. TPAP uses SPAKE2+/AES-CCM, not RSA.
# No fixed rsa release is available. Reassess this exception when changing
# tapo/rsa or adding another RSA consumer; remove when upstream permits it.
ignore = ["RUSTSEC-2023-0071"]
