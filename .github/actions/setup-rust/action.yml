name: Set up Rust
description: Keep local NAS artifacts and use GitHub caching on hosted runners
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        components: rustfmt, clippy
    - if: runner.environment == 'self-hosted'
      shell: bash
      run: echo "CARGO_TARGET_DIR=$HOME/.cache/denki-target" >> "$GITHUB_ENV"
    - if: runner.environment == 'github-hosted'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
