name: CI

on:
  workflow_dispatch:
  # Refresh advisories weekly, including weeks without repository changes.
  schedule:
    - cron: "23 17 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test release metadata guard
        run: python3 scripts/test_check_release.py -v

      - uses: ./.github/actions/setup-rust
      # Only tests compile here; formatting and registry checks share no build outputs.
      - parallel:
          - name: Test
            run: cargo test --locked
          - name: Check formatting
            run: cargo fmt --check
          - name: Check generated device documentation
            run: python3 scripts/update-device-docs.py --check
      # Keep Cargo compilation steps sequential to reuse the same target directory.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --document-private-items
      - name: Cargo registry preflight
        run: |
          python3 scripts/test_check_package.py -v
          python3 scripts/check-package.py
          cargo publish --locked --dry-run

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install pinned audit tool when needed
        run: |
          if ! cargo audit --version 2>/dev/null | grep -qx 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --locked --version 0.22.2
          fi
      - run: cargo audit

  build:
    if: github.event_name != 'schedule'
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo build --locked --release
