name: Publish crate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: crate-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    # Registry publication is limited to tags pushed by a user account.
    if: github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Validate manifest, lock and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/test_check_release.py
          python3 scripts/check-release.py "$RELEASE_TAG"
      - name: Require exact-source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$source_sha" "origin/main"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=100" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length > 0' "$RUNNER_TEMP/ci.json"
      - uses: ./.github/actions/setup-rust
      - name: Verify package
        run: |
          python3 scripts/test_check_package.py -v
          python3 scripts/check-package.py
          cargo publish --locked --dry-run
      - name: Audit locked dependencies before authentication
        run: |
          if ! cargo audit --version 2>/dev/null | grep -qx 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --locked --version 0.22.2
          fi
          cargo audit
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the checked crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
