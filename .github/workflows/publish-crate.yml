name: Publish crate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: crate-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    # Registry publication is limited to tags pushed by a user account.
    if: github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Validate manifest, lock and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/test_publish_workflow.py -v
          python3 scripts/test_check_release.py
          python3 scripts/check-release.py "$RELEASE_TAG"
      - name: Require exact-source CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$source_sha" "origin/main"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=100" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length > 0' "$RUNNER_TEMP/ci.json"
      - uses: ./.github/actions/setup-rust
      - name: Verify package
        run: |
          python3 scripts/test_check_package.py -v
          python3 scripts/check-package.py
          cargo publish --locked --dry-run --registry crates-io
      - name: Audit locked dependencies before authentication
        run: |
          if ! cargo audit --version 2>/dev/null | grep -qx 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --locked --version 0.22.2
          fi
          cargo audit
      - name: Record the verified package
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I - <<'PYTHON'
          import hashlib, json, os, pathlib, re, shutil, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise ValueError('Expected a stable package version')
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise ValueError('Package version does not match the tag')
          # Cargo 1.99.1 publish --dry-run retains its checked upload here.
          archive = pathlib.Path('target/package/tmp-registry') / ('denki-' + version + '.crate')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-crate'
          destination.mkdir(mode=0o700)
          shutil.copyfile(archive, destination / archive.name)
          evidence = dict(package='denki', version=version, source_sha=os.environ['SOURCE_SHA'],
                          archive_sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          (destination / 'release-preflight.json').write_text(json.dumps(evidence) + '\n')
          PYTHON
      - name: Retain the verified package only
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      # OIDC is job-wide: this fresh runner never checks out or builds source,
      # runs repository scripts or local actions, or restores a repository cache.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/verified-crate
      - name: Unpack the verified crate as data
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I - <<'PYTHON'
          import gzip, hashlib, io, json, os, pathlib, re, stat, tarfile, tomllib

          MAX_ARCHIVE = 16 * 1024 * 1024
          MAX_EXPANDED = 64 * 1024 * 1024
          MAX_FILE = 8 * 1024 * 1024
          MAX_MEMBERS = 4096

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def read_regular(path, limit):
              info = path.lstat()
              require(stat.S_ISREG(info.st_mode) and info.st_size <= limit,
                      'Expected a bounded regular artifact file')
              return path.read_bytes()

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, 'Duplicate metadata key')
                  result[key] = value
              return result

          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          artifact = root / 'verified-crate'
          require(stat.S_ISDIR(artifact.lstat().st_mode), 'Expected an artifact directory')
          evidence = json.loads(read_regular(artifact / 'release-preflight.json', 4096),
                                object_pairs_hook=unique_object)
          require(isinstance(evidence, dict) and set(evidence) ==
                  {'package', 'version', 'source_sha', 'archive_sha256'}, 'Invalid metadata fields')
          require(all(isinstance(value, str) for value in evidence.values()), 'Invalid metadata types')
          version = evidence['version']
          require(re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version),
                  'Expected a stable package version')
          require(evidence['package'] == 'denki' and 'v' + version == os.environ['RELEASE_TAG'],
                  'Package or tag mismatch')
          require(re.fullmatch(r'[0-9a-f]{40}', evidence['source_sha']) and
                  evidence['source_sha'] == os.environ['SOURCE_SHA'], 'Source SHA mismatch')
          require(re.fullmatch(r'[0-9a-f]{64}', evidence['archive_sha256']), 'Invalid archive digest')
          prefix = 'denki-' + version
          archive = artifact / (prefix + '.crate')
          require({path.name for path in artifact.iterdir()} ==
                  {archive.name, 'release-preflight.json'}, 'Unexpected artifact files')
          compressed = read_regular(archive, MAX_ARCHIVE)
          require(hashlib.sha256(compressed).hexdigest() == evidence['archive_sha256'],
                  'Archive digest mismatch')
          # Bound decompression before tar parsing, including padding and extended headers.
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
              expanded = stream.read(MAX_EXPANDED + 1)
          require(len(expanded) <= MAX_EXPANDED, 'Archive expands beyond the size limit')
          with tarfile.open(fileobj=io.BytesIO(expanded), mode='r:') as package:
              entries = {}
              total_size = 0
              for member in package:
                  require(len(entries) < MAX_MEMBERS, 'Too many archive members')
                  require(member.type in (tarfile.REGTYPE, tarfile.AREGTYPE, tarfile.DIRTYPE)
                          and member.sparse is None, 'Links, devices and sparse files are forbidden')
                  name = member.name
                  if member.isdir() and name.endswith('/'):
                      name = name[:-1]
                  parts = tuple(name.split('/'))
                  require(len(name) <= 1024 and parts[0] == prefix and
                          all(part not in ('', '.', '..') for part in parts) and
                          not any(ord(char) < 32 or ord(char) == 127 or char == '\\' for char in name),
                          'Non-normal or escaping archive path')
                  require(len(parts) > 1 or member.isdir(), 'Package root must be a directory')
                  require(parts not in entries, 'Duplicate archive path')
                  require(0 <= member.size <= MAX_FILE and (not member.isdir() or member.size == 0),
                          'Invalid or oversized archive member')
                  total_size += member.size
                  require(total_size <= MAX_EXPANDED, 'Archive contents exceed the size limit')
                  entries[parts] = member
              for parts in entries:
                  for length in range(1, len(parts)):
                      ancestor = entries.get(parts[:length])
                      require(ancestor is None or ancestor.isdir(), 'File/directory path conflict')

              def package_bytes(name):
                  member = entries.get((prefix, name))
                  require(member is not None and member.isfile(), 'Missing package metadata: ' + name)
                  return package.extractfile(member).read()

              manifest = tomllib.loads(package_bytes('Cargo.toml').decode())
              require(manifest['package']['name'] == 'denki' and manifest['package']['version'] == version,
                      'Packaged manifest mismatch')
              lock = tomllib.loads(package_bytes('Cargo.lock').decode())
              roots = [item for item in lock['package'] if item['name'] == 'denki' and 'source' not in item]
              require(len(roots) == 1 and roots[0]['version'] == version, 'Packaged lockfile mismatch')
              vcs = json.loads(package_bytes('.cargo_vcs_info.json'), object_pairs_hook=unique_object)
              require(vcs['git']['sha1'] == evidence['source_sha'] and
                      vcs['git'].get('dirty', False) is False, 'Packaged source is dirty or mismatched')
              destination = root / 'crate-publish'
              destination.mkdir(mode=0o700)
              (root / 'publish-cargo-home').mkdir(mode=0o700)
              # Create regular files ourselves; never honor tar owners, modes or links.
              for parts, member in entries.items():
                  # Cargo reserves this generated input name and recreates it
                  # from the normalized manifest when publishing the source.
                  if parts == (prefix, 'Cargo.toml.orig'):
                      continue
                  output = destination.joinpath(*parts)
                  if member.isdir():
                      output.mkdir(parents=True, exist_ok=True, mode=0o700)
                  else:
                      output.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                      with output.open('xb') as stream:
                          stream.write(package.extractfile(member).read())
                      output.chmod(0o600)
          # Cargo starts in the clean parent, not the source tree. Its isolated
          # CARGO_HOME, explicit toolchain and --no-verify exclude package code/config.
          (destination / 'manifest-path').write_text(str(destination / prefix / 'Cargo.toml'))
          PYTHON
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish without executing package code
        working-directory: ${{ runner.temp }}/crate-publish
        run: cargo +1.99.1 publish --no-verify --locked --registry crates-io --manifest-path "$(cat manifest-path)"
        env:
          CARGO_HOME: ${{ runner.temp }}/publish-cargo-home
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
