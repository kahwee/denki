[package]
name = "denki"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "CLI for controlling TP-Link smart home devices — denki (電気) means electricity in Japanese"
license = "MIT"
repository = "https://github.com/kahwee/denki"
homepage = "https://github.com/kahwee/denki"
readme = "README.md"
keywords = ["tplink", "kasa", "tapo", "smarthome", "cli"]
categories = ["command-line-utilities", "network-programming"]

# Registry source distribution: keep compile-time docs, registry and offline fixtures.
include = [
    "/src/**", "/tests/**", "/devices.toml", "/docs/library.md",
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE",
    "/CHANGELOG.md", "/CONTRIBUTING.md", "/rust-toolchain.toml", "/rustfmt.toml",
]

[lib]
name = "denki"
path = "src/lib.rs"

[[bin]]
name = "denki"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
anyhow = "1.0.104"
colored = "3.1.1"
futures-util = "0.3"
# KLAP protocol (Tapo devices)
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
rand = "0.10.3"
base64 = "0.23.1"

toml = "1.1.8"
if-addrs = "0.15.0"
rpassword = "7.5.4"
tempfile = "3.27.0"
# The bounded Auto Tapo implementation is bundled in src/tapo_vendor.
# Do not replace it with the upstream crate until it enforces streaming limits.

async-trait = { version = "0.1" }
base16ct = { version = "1.0", features = ["alloc"] }
ccm = { version = "0.6" }
chrono = { version = "0.4.34", features = ["clock", "serde"], default-features = false }
chrono-tz = { version = "0.10", features = ["serde"] }
crc32fast = { version = "1.5" }
hkdf = { version = "0.13" }
hmac = { version = "0.13" }
itertools = { version = "0.15" }
lazy_static = { version = "1.5" }
log = { version = "0.4" }
md-5 = { version = "0.11" }
p256 = { version = "0.14", features = ["arithmetic"], default-features = false }
pbkdf2 = { version = "0.13" }
reqwest = { version = "0.13", features = ["cookies", "json", "rustls"], default-features = false }
retina = { version = "0.4" }
rsa = { version = "0.10.0", features = ["getrandom"] }
serde_with = { version = "3.20" }
sha-crypt = { version = "0.6", default-features = false }
thiserror = { version = "2.0" }
tokio-stream = { version = "0.1" }
uuid = { version = "1.23", features = ["serde", "v4"] }

[dev-dependencies]
once_cell = "1.21"
rstest = "0.28.0"
proptest = "1.12.0"
insta = "1.49.0"
