[package]
name = "denki"
version = "0.1.0"
edition = "2021"
description = "CLI for controlling TP-Link smart home devices — denki (電気) means electricity in Japanese"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
