[package]
name = "denki"
version = "0.1.0"
edition = "2021"
description = "CLI for controlling TP-Link smart home devices — denki (電気) means electricity in Japanese"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
# KLAP protocol (Tapo devices)
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
rand = "0.8"
base64 = "0.22"
